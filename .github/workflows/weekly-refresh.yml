name: Weekly Dashboard Refresh (Streamlit)

on:
  schedule:
    - cron: '52 11 * * 2'  # toda terça, 8:52 BRT (UTC-3) — 15min depois do refresh do dashboard HTML, pra não bater os dois no Metabase ao mesmo tempo
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Modo teste: envia só pro meu DM no Slack, sem @channel'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly refresh
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_TEST: ${{ secrets.SLACK_WEBHOOK_URL_TEST }}
          TEST_MODE: ${{ inputs.test_mode }}
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
          SLACK_MENTION_ON_ERROR: '<@U0753LAQU1F>'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/weekly_refresh.py

      - name: Commit updated snapshot
        run: |
          git config user.name "mp-agencia-streamlit-bot"
          git config user.email "actions@github.com"
          # analysis.json e diagnosticos/ podem não existir (sem LLM_API_KEY a
          # análise é pulada); ai_context.json é puro cálculo e sai sempre.
          git add data/latest.json data/ai_context.json
          git add data/analysis.json data/diagnosticos 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada a commitar."
            exit 0
          fi
          git commit -m "Refresh snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push
